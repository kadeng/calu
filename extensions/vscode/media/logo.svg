<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="calu">
  <!-- calu's mark: a guardian disc. The outer ring is cut into three arcs (the checkers that
       watch a session), the inner ring is closed (the session), and the check in the middle
       is the verdict. An original drawing; not derived from any film's artwork. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#101a26"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="1" stop-color="#27c3f5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <g fill="none" stroke="url(#beam)" stroke-linecap="round" filter="url(#glow)">
    <!-- outer ring, r = 92: three arcs of 96 degrees with gaps of 24 -->
    <circle cx="128" cy="128" r="92" stroke-width="13"
            stroke-dasharray="154.2 38.5" transform="rotate(-78 128 128)"/>
    <!-- inner ring -->
    <circle cx="128" cy="128" r="62" stroke-width="4" opacity="0.75"/>
    <!-- the verdict -->
    <path d="M99 130 L121 152 L160 106" stroke-width="15" stroke-linejoin="round"/>
  </g>
  <!-- three markers on the gaps: the points where a checker looks in -->
  <g fill="#ffb454">
    <circle cx="128" cy="36" r="5"/>
    <circle cx="207.7" cy="174" r="5"/>
    <circle cx="48.3" cy="174" r="5"/>
  </g>
</svg>
