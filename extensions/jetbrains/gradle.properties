# The PyCharm build the plugin is compiled against (the unified distribution, 2025.3 and later).
intellijPlatformVersion=2026.3
pluginVersion=0.1.0
# The platform brings the Kotlin standard library; the plugin must not bundle a second one.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
# No build cache: it restored test classes compiled against an older `shared` (a data class that
# gained a member), and the tests then failed with NoSuchMethodError or ran against stale code.
org.gradle.caching=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
