[versions]
# Compile-only: at run time every module uses the platform's copy (README, "Rules").
kotlin-serialization = "1.9.0"
junit-jupiter = "5.14.4"
junit-platform = "1.14.4"
junit4 = "4.13.2"

[libraries]
kotlin-serialization-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "kotlin-serialization" }
kotlin-serialization-json-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "kotlin-serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
