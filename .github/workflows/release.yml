# Publish a release to PyPI (PLAN.md D1: the wheel is the shipping format, D41: no binary).
#
# This workflow does nothing until two one-time steps are done, both of which only the
# maintainer can do:
#
#   1. Create the project on PyPI and add a trusted publisher for it: owner `kadeng`,
#      repository `calu`, workflow `release.yml`, environment `pypi`. Trusted publishing uses a
#      short-lived OIDC token, so no API token is stored in this repository.
#   2. Create the GitHub environment `pypi` (Settings -> Environments), optionally with a
#      required reviewer, which makes every publish wait for a human.
#
# Until the environment exists the `publish` job cannot run, so a tag pushed by accident builds
# the wheel, builds and runs the single-file binary (the `binary` job, which attaches it to the
# run as an artifact) and stops there. Release:
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: the tag must be the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: uv build --out-dir dist
      # The same check as in checks.yml: what calu reads at runtime must be in the wheel.
      - name: the wheel runs when installed
        run: |
          set -euo pipefail
          uv venv /tmp/installed
          uv pip install --python /tmp/installed/bin/python "$(echo dist/*.whl)[web]"
          /tmp/installed/bin/calu --version
          /tmp/installed/bin/calu protocol --out /tmp/protocol.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binary:
    name: the single-file binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The script builds the binary **and runs it**: a dependency that reads its own package
      # metadata at import time breaks a frozen build with nothing to show at build time
      # (measured: `spikes/RESULTS.md`, "A single-file binary"), so building alone proves
      # nothing.
      - run: scripts/build-binary.sh dist-binary
      - uses: actions/upload-artifact@v4
        with:
          name: calu-linux-x86_64
          path: dist-binary/calu

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Needs the environment `pypi` to exist; see the comment at the top.
    environment: pypi
    permissions:
      # Trusted publishing: the job mints an OIDC token instead of using a stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
