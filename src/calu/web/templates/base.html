<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}calu{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='/calu.css') }}">
<script src="{{ url_for('static', path='/calu.js') }}" defer></script>
</head>
<body data-sessions-api="{{ url_for('sessions_json') }}" data-triage-url="{{ url_for('triage') }}">
<header>
  <span class="name"><a href="{{ url_for('fleet') }}">calu</a></span>
  <nav>
    <a href="{{ url_for('fleet') }}">Sessions</a>
    <a href="{{ url_for('escalations') }}">Escalations</a>
    <a href="{{ url_for('triage') }}">Triage</a>
    <a href="{{ url_for('checkers') }}">Checkers</a>
    <a href="{{ url_for('rules') }}">Rules</a>
    <a href="{{ url_for('settings') }}">Settings</a>
  </nav>
  {% block header_extra %}{% endblock %}
  <span class="count" id="attention"></span>
  <span class="hint">Ctrl+K</span>
  <span class="version">calu {{ version }} · local only</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
