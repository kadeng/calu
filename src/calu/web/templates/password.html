<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>calu · sign in</title>
{# The page a browser without a login gets (TokenGate, D216). It loads nothing: a browser
   that is not signed in is served no other file. #}
<style>
  body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 15vh auto; padding: 0 1rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  input { width: 100%; box-sizing: border-box; margin: .5rem 0 1rem; }
  .problem { color: #b3261e; }
</style>
</head>
<body>
<h1>calu web</h1>
{% if problem %}<p class="problem">{{ problem }}</p>{% endif %}
<form method="post" action="{{ action }}">
  <input type="hidden" name="onward" value="{{ onward }}">
  <label for="password">Admin password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
  <button>Sign in</button>
</form>
<p>The password is checked by the database and kept nowhere.</p>
</body>
</html>
