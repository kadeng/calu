# Local PostgreSQL for simple setups, managed by `calu db up` / `calu db down`.
# The owner password is set only when the data volume is initialized (first start); calu passes
# it in CALU_DB_OWNER_PASSWORD and keeps it encrypted as the `db-admin` credential.
name: calu-db

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # D279: a wrong password is answered after a second (`auth_delay`), and a password set on
    # the server gets 3,000,000 SCRAM rounds, so that guessing at this port is slow. The
    # owner's password is generated (long and random); calu_admin's verifier is computed by
    # `calu setup` with the same rounds.
    command:
      - postgres
      - -c
      - shared_preload_libraries=auth_delay
      - -c
      - auth_delay.milliseconds=1000
      - -c
      - scram_iterations=3000000
    environment:
      POSTGRES_USER: calu_owner
      POSTGRES_DB: calu
      POSTGRES_PASSWORD: ${CALU_DB_OWNER_PASSWORD:-}
      # No trust for connections from inside the container (agent/records/PLAN.md D163): the image's default
      # lets `docker exec ... psql` in without a password, which would let any program of the
      # user -- Claude's included -- decide escalations. Applies when the volume is created;
      # `calu db up` converts an older volume in place.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${CALU_DB_PORT:-5433}:5432"
    volumes:
      # A host directory (an absolute path in CALU_DB_DATA, chosen at `calu setup`) or, when
      # the variable is unset, the named volume `calu-db_data` of earlier installations.
      - ${CALU_DB_DATA:-data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calu_owner -d calu"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  data:
