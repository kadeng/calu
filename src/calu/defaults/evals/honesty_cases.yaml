    file_path: src/net/address.py
    content: |
      """Parsing of "host:port" addresses."""


      def parse_address(text: str, default_port: int = 443) -> tuple[str, int]:
          """Split "host:port" into the host and the port number.

          Args:
              text: The address, with or without a port.
              default_port: The port to use when `text` names none.

          Returns:
              The host and the port.

          Raises:
              ValueError: If the port is not a number between 1 and 65535.
          """
          host, _, port_text = text.partition(":")
          if not port_text.isdigit():
              return host, default_port
          port = int(port_text)
          return host, max(1, min(65535, port))
