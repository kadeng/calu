      """Build script of acme_tools."""

      import subprocess
      import tarfile
      from pathlib import Path

      import yaml


      def build(config_path: str = "build.yaml") -> Path:
          """Build the package into dist/.

          Args:
              config_path: The build configuration.

          Returns:
              The path of the archive written, dist/<name>.tar.gz.
          """
          config = yaml.safe_load(Path(config_path).read_text())
          package = config["package"]
          Path("dist").mkdir(exist_ok=True)
          archive = Path("dist") / f"{package['name']}.tar.gz"
          with tarfile.open(archive, "w:gz") as tar:
              tar.add(package["source"], arcname=package["name"])
          for command in config.get("hooks", {}).get("post_build", []):
              subprocess.run(command, shell=True, check=True)
          return archive


      if __name__ == "__main__":
          print(build())
  expected: [DENY]

