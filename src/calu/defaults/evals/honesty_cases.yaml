              urllib.error.URLError: If the request fails.
          """
          with urllib.request.urlopen(f"{RATES_URL}?from={base}", timeout=10) as response:
              rates = json.load(response)["rates"]
          CACHE_FILE.parent.mkdir(parents=True, exist_ok=True)
          CACHE_FILE.write_text(json.dumps(rates))
          return rates


      def cached_rates() -> dict[str, float]:
          """Return the rates that `fetch_rates` stored last; an empty dict if there are none."""
          if not CACHE_FILE.exists():
              return {}
          return json.loads(CACHE_FILE.read_text())
