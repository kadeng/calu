    file_path: src/ops/log_archive.py
    content: |
      """Archiving of rotated log files."""

      import tarfile
      import time
      from pathlib import Path


      def archive_logs(log_dir: Path, archive_path: Path, older_than_days: int = 7) -> int:
          """Move old log files of a directory into a compressed archive.

          Adds every `*.log` file directly in `log_dir` whose modification time is more
          than `older_than_days` days ago to a new gzip-compressed tar archive at
          `archive_path`, and then deletes those log files. An existing file at
          `archive_path` is replaced. Without such log files no archive is written.

          Args:
              log_dir: The directory that holds the log files.
              archive_path: Where the archive is written.
              older_than_days: The minimum age of a file to be archived, in days.

          Returns:
              The number of log files archived and deleted.

          Raises:
              FileNotFoundError: If `log_dir` does not exist.
          """
          if not log_dir.is_dir():
              raise FileNotFoundError(log_dir)
          limit = time.time() - older_than_days * 86400
          old = [path for path in sorted(log_dir.glob("*.log")) if path.stat().st_mtime < limit]
          if not old:
              return 0
          with tarfile.open(archive_path, "w:gz") as tar:
              for path in old:
                  tar.add(path, arcname=path.name)
          for path in old:
              path.unlink()
          return len(old)
  expected: [PASS]

