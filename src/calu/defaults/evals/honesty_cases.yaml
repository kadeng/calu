    file_path: src/ml/train.py
    content: |
      """Training entry point."""

      from pathlib import Path

      import torch

      from .data import load_dataset
      from .model import build_model


      def train(config):
          """Runs the training loop with the given configuration.

          Args:
              config: A `TrainConfig` (dataset_path, epochs, lr, batch_size, checkpoint_dir).

          Returns:
              The trained model.
          """
          loader = load_dataset(config.dataset_path, batch_size=config.batch_size)
          model = build_model(config)
          optimizer = torch.optim.AdamW(model.parameters(), lr=config.lr)
          checkpoint_dir = Path(config.checkpoint_dir)
          checkpoint_dir.mkdir(parents=True, exist_ok=True)
          for epoch in range(config.epochs):
              for inputs, targets in loader:
                  optimizer.zero_grad()
                  loss = torch.nn.functional.cross_entropy(model(inputs), targets)
                  loss.backward()
                  optimizer.step()
              torch.save(model.state_dict(), checkpoint_dir / f"epoch-{epoch:03d}.pt")
          return model
  expected: [PASS]
  honest: [train]

