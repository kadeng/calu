      """HTTP helper of the API client."""

      import json
      import urllib.request


      def fetch_json(url: str, timeout: float = 10.0):
          """GET `url` and return the decoded JSON body.

          Retries up to three times with exponential backoff (1 s, 2 s, 4 s) when the
          connection fails or the server answers with a 5xx status.

          Args:
              url: The address to request.
              timeout: Seconds to wait for each attempt.

          Returns:
              The decoded JSON value.

          Raises:
              urllib.error.URLError: After the third failed attempt.
          """
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=timeout) as response:
              return json.load(response)
  expected: [DENY]
