# Development and test environment (PLAN.md §10).
#
#   docker compose up -d caludb                       # test database only
#   docker compose run --rm dev uv run pytest -m 'not live'
#   docker compose run --rm dev bash                  # shell in the dev system
#
# The test database is reachable from the host at 127.0.0.1:55432 (user calu_owner, password
# calu-dev, database calu). These credentials are for development only.
name: calu-dev

services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /work
    # Docker's default seccomp profile blocks `unshare(CLONE_NEWUSER)`, so bubblewrap — and with
    # it Claude Code's sandbox — cannot start inside a container without this (measured: PLAN.md
    # Q1, spikes/RESULTS.md). It loosens the *container's* seccomp, not calu's own isolation, and
    # it is the least of the options that work: `--cap-add SYS_ADMIN` and `--privileged` grant
    # more, `apparmor=unconfined` does not help at all. This is the development system; a
    # production host runs calu directly, where no such trade is needed.
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/work
      - dev-venv:/venv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      CALU_TEST_DSN: postgresql://calu_owner:calu-dev@caludb:5432/calu
    depends_on:
      caludb:
        condition: service_healthy
    command: ["uv", "run", "pytest", "-m", "not live"]

  caludb:
    image: postgres:18
    environment:
      POSTGRES_USER: calu_owner
      POSTGRES_PASSWORD: calu-dev
      POSTGRES_DB: calu
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - caludb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calu_owner -d calu"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dev-venv:
  caludb-data:
